name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_confirmed:
        description: 'I have verified the version in electron/package.json and confirm this release is intentional'
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '10.34.1'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: ${{ inputs.version_confirmed == true }}
    outputs:
      app_version: ${{ steps.read_version.outputs.app_version }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Read Release Version
        id: read_version
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          APP_VERSION="v$VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "App Version: $APP_VERSION"

      - name: Prepare GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.read_version.outputs.app_version }}"
          PRERELEASE_FLAG=""
          if [[ "$APP_VERSION" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$APP_VERSION" > /dev/null 2>&1; then
            echo "Release $APP_VERSION not found, creating draft..."
            gh release create "$APP_VERSION" --draft $PRERELEASE_FLAG --title "${APP_VERSION#v}" --notes ""
          else
            echo "Release $APP_VERSION already exists, skipping creation."
          fi

  release-windows:
    needs: prepare-release
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run publish

  release-linux:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run publish

  release-macos:
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Setuptools for Python (macOS only)
        run: pip3 install setuptools --break-system-packages

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run publish

  release-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}

    defaults:
      run:
        working-directory: ./capacitor

    steps:
      - name: Free Disk Space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null

      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Native + Web
        run: pnpm run build:app

      - name: Build Android APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Stop Gradle Daemon
        run: cd android && ./gradlew --stop

      - name: Sign Android APK
        id: sign_app
        uses: RockinChaos/sign-android@v1.1.0
        with:
          releaseDir: capacitor/android/app/build/outputs/apk/release
          signingKey: "${{ secrets.SIGNING_KEY }}"
          keyAlias: "${{ secrets.ALIAS }}"
          keyStorePassword: "${{ secrets.KEY_STORE_PASSWORD }}"
          keyPassword: "${{ secrets.KEY_PASSWORD }}"
          appName: Shiru
          appVersion: ${{ env.APP_VERSION }}
          appPrefix: android

      - name: Split Signed Files
        uses: jungwinter/split@v2
        id: signed_files
        with:
          msg: ${{ steps.sign_app.outputs.signedFiles }}
          separator: ':'

      - name: Generate latest-android.yml
        run: |
          echo "version: ${{ env.APP_VERSION }}" | sed 's/^version: v/version: /' > latest-android.yml

      - name: Publish Android APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in "${{ steps.signed_files.outputs._0 }}" "${{ steps.signed_files.outputs._1 }}" "${{ steps.signed_files.outputs._2 }}" "${{ steps.signed_files.outputs._3 }}"; do
            if [ -n "$f" ]; then
              echo "uploading $(basename $f)"
              gh release upload --clobber "$APP_VERSION" "../$f"
            fi
          done
          echo "uploading latest-android.yml"
          gh release upload --clobber "$APP_VERSION" latest-android.yml

      - name: Clean Build Artifacts
        run: rm -rf ./build