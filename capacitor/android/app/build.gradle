apply plugin: 'com.android.application'

def verCode = 0

def jsonFile = file('../../../electron/package.json')
def parsedJson = new groovy.json.JsonSlurper().parseText(jsonFile.text)
def verName = parsedJson.version
def versions = verName.tokenize('.')
def cleanVersions = versions.take(3).collect { it.replaceAll(/[^0-9]/, '') }

cleanVersions.each (code) -> {
    verCode = (verCode*100) + Integer.parseInt(code)
}

// TorBox (debrid) fork installs alongside regular Shiru: only the applicationId
// (install identity) changes; the namespace (code package) stays the same.
def torboxBackend = System.getenv('SHIRU_BACKEND') == 'torbox'

android {
    namespace = "watch.shiru"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = torboxBackend ? "watch.shiru.torbox" : "watch.shiru"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = verCode
        versionName = verName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        androidResources {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable gradle.startParameter.taskNames.any { it.contains("Release") } // https://stackoverflow.com/a/39950584
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    // Map for the version code
    project.ext.versionCodes = ['arm64-v8a': 1, 'armeabi-v7a': 2, 'x86_64': 3, 'universal': 4, 'debug': 5]

    android.applicationVariants.all { variant ->
        // Assign different version code for each output
        variant.outputs.each { output ->
            def versionCodes = project.ext.versionCodes
            def baseVersionCode = android.defaultConfig.versionCode
            def abiVersionCode = 0

            if (output.getFilter(com.android.build.OutputFile.ABI)) {
                abiVersionCode = versionCodes.get(output.getFilter(com.android.build.OutputFile.ABI), 0)
            } else {
                // This is for the universal APK
                abiVersionCode = versionCodes.get('universal', 0)
            }

            if (output.hasProperty('versionCodeOverride')) {
                output.versionCodeOverride = gradle.startParameter.taskNames.any { it.contains("Release") } ? abiVersionCode * 1000000 + baseVersionCode : versionCodes.get('debug') * 1000000 + baseVersionCode
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.documentfile:documentfile:$androidxDocumentFileVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}